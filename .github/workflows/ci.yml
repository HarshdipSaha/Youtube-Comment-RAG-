name: CI

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" matplotlib

      - name: Lint
        run: ruff check ytrag tests

      # The whole suite runs offline: no API keys, no model downloads, no network.
      - name: Test
        run: pytest --cov=ytrag --cov-report=term-missing

      - name: Smoke-test the CLI against the sample corpus
        shell: bash
        run: |
          python -m ytrag.cli --index /tmp/kb build --csv youtube_comments.csv
          python -m ytrag.cli --index /tmp/kb ask "which comment has the most likes?"
          python -m ytrag.cli --index /tmp/kb --json overview > /dev/null
